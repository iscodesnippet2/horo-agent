name: Release Artifact Audit

on:
  pull_request:
    paths:
      - pyproject.toml
      - MANIFEST.in
      - setup.py
      - scripts/audit_release_artifacts.py
      - .github/workflows/release-artifact-audit.yml
  push:
    branches: [lite, main]
    paths:
      - pyproject.toml
      - MANIFEST.in
      - setup.py
      - scripts/audit_release_artifacts.py
      - .github/workflows/release-artifact-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.11"

      - name: Install build and audit tools
        run: python -m pip install --upgrade pip build pip-audit

      - name: Build artifacts
        run: python -m build --sdist --wheel

      - name: Audit artifact contents
        run: python scripts/audit_release_artifacts.py dist/*

      - name: Install wheel in clean environment
        run: |
          python -m venv /tmp/horo-release-audit
          /tmp/horo-release-audit/bin/python -m pip install --upgrade pip setuptools
          /tmp/horo-release-audit/bin/python -m pip install dist/*.whl
          /tmp/horo-release-audit/bin/python -m pip install pip-audit
          /tmp/horo-release-audit/bin/python -m pip_audit --progress-spinner off
